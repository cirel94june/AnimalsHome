<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe9f6">
<title>小日历</title>
<link rel="stylesheet" href="/static/ib/desk.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--ib-sys, system-ui, sans-serif); color: var(--ib-tx, #0a1e42); min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
.page { max-width: 560px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
.top-bar { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.top-bar h2 { font-family: var(--ib-serif, serif); font-weight: 400; font-size: 22px; flex: 1; }
.back-btn, .nav { border: none; background: rgba(255,255,255,.55); border-radius: 50%; width: 34px; height: 34px; font-size: 15px; color: var(--ib-acc, #3d6fd8); flex: none; }
.panel { border-radius: 22px; padding: 14px; margin-bottom: 12px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.85); box-shadow: 0 8px 24px rgba(70,100,150,.1); }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.head b { font-family: var(--ib-serif, serif); font-weight: 400; font-size: 20px; }
.week, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.week span { font-size: 11.5px; color: var(--ib-tx3); padding-bottom: 4px; }
.cell { aspect-ratio: 1 / 1.08; border: 0; border-radius: 12px; background: transparent; color: var(--ib-tx); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5px; font-size: 13.5px; position: relative; }
.cell i { font-style: normal; font-size: 15px; line-height: 1.25; }
.cell em { position: absolute; bottom: 5px; width: 18px; height: 3px; border-radius: 2px; background: var(--ib-acc, #3d6fd8); }
.cell.today { color: var(--ib-acc, #3d6fd8); font-weight: 700; }
.cell.on { background: rgba(61,111,216,.16); }
.hint { font-size: 11.5px; color: var(--ib-tx3); text-align: center; margin-top: 8px; }
h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.sub { font-size: 12.5px; color: var(--ib-tx2); margin: 12px 0 6px; }
.cell u { position: absolute; top: 4px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #d9704f; text-decoration: none; }
.cell { position: relative; }
.moods { display: flex; justify-content: space-between; gap: 2px; }
.moods button { border: 0; background: transparent; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; }
.moods button.on { background: rgba(61,111,216,.2); }
.note { width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 12px; border: 1px solid rgba(120,150,200,.35); background: rgba(255,255,255,.7); color: var(--ib-tx); font: inherit; font-size: 14px; }
.bar { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.bar span { width: 4.2em; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar div { flex: 1; height: 8px; border-radius: 4px; background: rgba(120,150,200,.2); overflow: hidden; }
.bar div i { display: block; height: 100%; background: linear-gradient(90deg, #7fa6dd, #5c86c8); }
.bar b { font-weight: 400; color: var(--ib-tx3); font-size: 12px; min-width: 2em; text-align: right; }
.ev { display: flex; gap: 10px; padding: 8px 0; border-top: 1px dashed rgba(120,150,200,.3); font-size: 13.5px; line-height: 1.6; }
.ev:first-child { border-top: 0; }
.ev time { color: var(--ib-tx3); font-size: 12px; flex: none; width: 3em; padding-top: 2px; }
.ev small { display: block; color: var(--ib-acc, #3d6fd8); font-size: 12px; }
.none { color: var(--ib-tx3); font-size: 13px; text-align: center; padding: 10px 0; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar"><button class="back-btn" id="back" aria-label="返回">⬅</button><h2>小日历</h2></div>
  <section class="panel">
    <div class="head"><button class="nav" id="prev" aria-label="上个月">‹</button><b id="title"></b><button class="nav" id="next" aria-label="下个月">›</button></div>
    <div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="grid" id="grid"></div>
    <div class="hint">小横线越深，那天聊得越多；小圆点是节日或你加的日子（在桌面设置里添加）</div>
  </section>
  <section class="panel" id="detail" hidden>
    <h3 id="day-title"></h3>
    <div class="moods" id="moods"></div>
    <input class="note" id="note" maxlength="200" placeholder="今天想记一句什么？">
    <div class="sub">聊天频率</div><div id="chats"></div>
    <div class="sub">家里的动态</div><div id="events"></div>
  </section>
</div>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(path, opts) {
    return fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {})).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.detail || '没成功'); return j; });
    });
  }
  var now = new Date(), year = now.getFullYear(), month = now.getMonth() + 1, data = null, selected = '', current = null, seq = 0;

  function renderMonth() {
    $('title').textContent = year + ' 年 ' + month + ' 月';
    var keys = Object.keys(data.days).sort(), most = 1;
    keys.forEach(function (k) { most = Math.max(most, data.days[k].chats); });
    var blanks = '';
    for (var i = 0; i < data.first_weekday; i++) blanks += '<span></span>';
    $('grid').innerHTML = blanks + keys.map(function (k) {
      var c = data.days[k], cls = 'cell' + (k === data.today ? ' today' : '') + (k === selected ? ' on' : '');
      return '<button class="' + cls + '" data-day="' + k + '">' + parseInt(k.slice(8), 10) + '<i>' + esc(c.mood) + '</i>' +
        (c.festivals && c.festivals.length ? '<u title="' + esc(c.festivals.join('、')) + '"></u>' : '') + (c.chats ? '<em style="opacity:' + (0.25 + 0.75 * c.chats / most).toFixed(2) + '"></em>' : '') + '</button>';
    }).join('');
  }
  function loadMonth() {
    var mine = ++seq;
    return api('/api/calendar/month?year=' + year + '&month=' + month).then(function (j) {
      if (mine !== seq) return;
      data = j; renderMonth();
      if (!selected && data.days[data.today]) openDay(data.today);
    });
  }
  function renderDetail(d) {
    current = d;
    var parts = d.date.split('-');
    $('day-title').textContent = parseInt(parts[1], 10) + ' 月 ' + parseInt(parts[2], 10) + ' 日' + (d.festivals && d.festivals.length ? ' · ' + d.festivals.join('、') : '');
    $('moods').innerHTML = d.moods.map(function (m) { return '<button class="' + (m === d.mood ? 'on' : '') + '" data-mood="' + esc(m) + '">' + esc(m) + '</button>'; }).join('');
    $('note').value = d.note || '';
    var top = d.chats.length ? d.chats[0].count : 1;
    $('chats').innerHTML = d.chats.length ? d.chats.map(function (c) {
      return '<div class="bar"><span>' + esc(c.name) + '</span><div><i style="width:' + Math.max(4, Math.round(c.count / top * 100)) + '%"></i></div><b>' + c.count + '</b></div>';
    }).join('') : '<div class="none">这天没有聊天</div>';
    $('events').innerHTML = d.events.length ? d.events.map(function (e) {
      var t = new Date(e.at * 1000);
      return '<div class="ev"><time>' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + '</time><div><small>' + esc(e.name) + ' · ' + esc(e.kind) + '</small>' + esc(e.text) + '</div></div>';
    }).join('') : '<div class="none">这天家里很安静</div>';
    $('detail').hidden = false;
  }
  var dayReq = 0;
  function openDay(key) {
    selected = key; renderMonth();
    var mine = ++dayReq;
    api('/api/calendar/day?date=' + key).then(function (d) { if (mine === dayReq) renderDetail(d); });
  }
  function saveMood(mood) {
    var key = current.date;
    return api('/api/calendar/mood', { method: 'POST', body: JSON.stringify({ date: key, mood: mood, note: $('note').value }) }).then(function (r) {
      current.mood = r.mood; current.note = r.note;
      if (data.days[key]) data.days[key].mood = r.mood;
      renderMonth();
      Array.prototype.forEach.call($('moods').children, function (b) { b.className = b.dataset.mood === r.mood ? 'on' : ''; });
    });
  }
  function shift(by) {
    month += by;
    if (month < 1) { month = 12; year--; } else if (month > 12) { month = 1; year++; }
    loadMonth();
  }
  $('prev').onclick = function () { shift(-1); };
  $('next').onclick = function () { shift(1); };
  $('grid').addEventListener('click', function (e) { var b = e.target.closest('[data-day]'); if (b) openDay(b.dataset.day); });
  $('moods').addEventListener('click', function (e) { var b = e.target.closest('[data-mood]'); if (b) saveMood(b.dataset.mood === current.mood ? '' : b.dataset.mood); });
  $('note').addEventListener('change', function () { if (current) saveMood(current.mood); });
  $('back').onclick = function () { if (history.length > 1) history.back(); else location.href = '/'; };
  loadMonth();
})();
</script>
</body>
</html>
