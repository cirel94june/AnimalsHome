<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- 外层页面的规则：里面的小作品自己跳转到别的网址也会被拦（狐狸 §217 H1） -->
<meta http-equiv="Content-Security-Policy" content="frame-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小作品</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--ib-sans, system-ui, sans-serif); color: var(--ib-tx, #0a1e42); display: flex; flex-direction: column; height: 100dvh; }
.top-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; }
.top-bar button.back { color: inherit; font-size: 20px; border: none; background: none; cursor: pointer; }
.top-bar h2 { flex: 1; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#list { flex: 1; overflow-y: auto; padding: 0 14px 20px; }
.work { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: rgba(255,255,255,.55); border: 1px solid var(--ib-glass-line, rgba(255,255,255,.7)); border-radius: 16px; padding: 12px 14px; margin-top: 10px; }
.work b { font-size: 15px; font-weight: 600; }
.work.new b::after { content: "  新"; color: #c0563f; font-size: 12px; }
.work small { display: block; font-size: 12px; color: var(--ib-tx3, #7d92b5); margin-top: 3px; }
.work p { font-size: 14px; margin-top: 5px; line-height: 1.5; }
.empty { text-align: center; color: var(--ib-tx3, #7d92b5); font-size: 13px; padding: 56px 20px; line-height: 1.8; }
#viewer { flex: 1; display: none; flex-direction: column; min-height: 0; }
#note { font-size: 14px; line-height: 1.5; padding: 0 16px 8px; }
#frame { flex: 1; width: 100%; border: 0; background: #fff; }
.foot { display: flex; justify-content: flex-end; padding: 8px 14px calc(8px + env(safe-area-inset-bottom)); }
.foot button { border: 1px solid var(--ib-line, #cbd8ec); background: rgba(255,255,255,.66); color: inherit; border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div class="top-bar"><button class="back" id="back" aria-label="返回">←</button><h2 id="title">小作品</h2></div>
<div id="list"></div>
<div id="viewer">
  <div id="note"></div>
  <iframe id="frame" sandbox="allow-scripts" referrerpolicy="no-referrer" title="小作品"></iframe>
  <div class="foot"><button id="del" type="button">删除</button></div>
</div>
<script>
(function () {
  'use strict';
  // 网页是 AI 写的，当不受信任的内容：sandbox 不给 allow-same-origin（读不到家里的任何东西），
  // 这条策略放在最前面，禁止它连网和加载外部资源。
  var CSP = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; form-action 'none'; base-uri 'none'";
  var list = document.getElementById('list'), viewer = document.getElementById('viewer');
  var frame = document.getElementById('frame'), heading = document.getElementById('title'), del = document.getElementById('del');
  var openId = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function api(url, opts) { return fetch(url, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function when(ts) { var d = new Date(ts * 1000); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }

  function showList() {
    openId = null; frame.srcdoc = ''; viewer.style.display = 'none'; list.style.display = 'block'; heading.textContent = '小作品';
    api('/api/works').then(function (d) {
      list.textContent = '';
      if (!d.works.length) { list.appendChild(el('div', 'empty', '还没有小作品。\nAI 想给你做的时候，会悄悄放在这里。')); return; }
      d.works.forEach(function (w) {
        var b = el('button', 'work' + (w.opened_at ? '' : ' new')); b.type = 'button';
        b.appendChild(el('b', '', w.title));
        b.appendChild(el('small', '', w.name + ' · ' + when(w.created_at) + (w.occasion ? ' · ' + w.occasion : '')));
        if (w.note) b.appendChild(el('p', '', w.note));
        b.onclick = function () { showWork(w.id); };
        list.appendChild(b);
      });
    }).catch(function () { list.textContent = ''; list.appendChild(el('div', 'empty', '读取失败，稍后再试')); });
  }
  function showWork(id) {
    api('/api/works/' + encodeURIComponent(id)).then(function (w) {
      openId = id; list.style.display = 'none'; viewer.style.display = 'flex'; heading.textContent = w.title;
      document.getElementById('note').textContent = w.note ? w.name + '：' + w.note : '';
      del.dataset.sure = ''; del.textContent = '删除';
      frame.srcdoc = '<meta http-equiv="Content-Security-Policy" content="' + CSP + '">' + w.html;
    }).catch(function () { showList(); });
  }
  del.onclick = function () {
    if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = '再点一下删除'; return; }
    api('/api/works/' + encodeURIComponent(openId), { method: 'DELETE' }).then(showList).catch(showList);
  };
  document.getElementById('back').onclick = function () {
    if (openId) showList(); else if (document.referrer) history.back(); else location.href = '/';
  };
  var requested = new URLSearchParams(location.search).get('work');
  if (requested && /^w_[a-f0-9]{16}$/.test(requested)) showWork(requested); else showList();
})();
</script>
</body>
</html>
