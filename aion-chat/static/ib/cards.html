<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe9f6">
<title>AI 名片</title>
<link rel="stylesheet" href="/static/ib/desk.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--ib-sys, system-ui, sans-serif); color: var(--ib-tx, #0a1e42); overflow: hidden; -webkit-tap-highlight-color: transparent; }
.page { height: 100dvh; display: flex; flex-direction: column; }
.top-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; flex: none; }
.top-bar h2 { font-weight: 400; flex: 1; min-width: 0; }
.pack-btn { flex: none; border: 1px solid rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.6); color: var(--ib-acc); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; }
.deck { flex: 1; min-height: 0; display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 14px 28px 10px; scrollbar-width: none; }
.deck::-webkit-scrollbar { display: none; }
.card {
  flex: 0 0 calc(100% - 8px);
  max-width: 420px;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  border-radius: 28px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.46);
  border: 1px solid rgba(255, 255, 255, 0.8);
  box-shadow: 0 14px 40px rgba(70, 100, 150, 0.16);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
}
.cover { position: relative; height: 34%; min-height: 150px; flex: none; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 55%, #fff), color-mix(in srgb, var(--c) 18%, #fff)); }
.cover::after { content: ""; position: absolute; inset: auto 0 0 0; height: 60%; background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.5)); }
.cover .no { position: absolute; top: 14px; left: 18px; z-index: 1; font-family: var(--ib-disp); font-weight: 300; font-size: 10px; letter-spacing: 0.34em; color: rgba(255, 255, 255, 0.95); text-transform: uppercase; }
.ava { position: relative; z-index: 2; width: 104px; height: 104px; margin: -60px auto 0; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255, 255, 255, 0.95); box-shadow: 0 10px 26px rgba(50, 80, 130, 0.25); background: #eef3fa; flex: none; }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ava.empty { display: flex; align-items: center; justify-content: center; color: var(--ib-tx3); font-family: var(--ib-serif); font-size: 40px; }
.body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 22px 18px; text-align: center; }
.name { font-family: var(--ib-serif); font-weight: 600; font-size: 30px; line-height: 1.15; }
.sign { margin-top: 8px; font-size: 13.5px; line-height: 1.7; color: var(--ib-tx2); font-style: italic; min-height: 1.7em; }
.stats { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
.stat { flex: 1; max-width: 140px; padding: 10px 6px; border-radius: 16px; background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.75); }
.stat b { display: block; font-family: var(--ib-serif); font-weight: 600; font-size: 24px; line-height: 1.1; color: var(--c); }
.stat span { font-family: var(--ib-disp); font-weight: 300; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ib-tx3); }
.meta { margin-top: 14px; font-size: 12px; color: var(--ib-tx3); line-height: 1.8; }
.btns { display: flex; gap: 10px; margin-top: 18px; }
.btns button, .btns a { flex: 1; padding: 11px 0; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.62); color: var(--ib-acc); font-size: 14px; text-decoration: none; }
.btns .primary { background: linear-gradient(135deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); color: #fff; border: none; }
.btns .muted { color: var(--ib-tx3); }
.card.off .cover { filter: grayscale(0.85); opacity: 0.6; }
.card.off .name { color: var(--ib-tx3); }
.pager { flex: none; display: flex; justify-content: center; gap: 6px; padding: 4px 0 calc(16px + env(safe-area-inset-bottom)); }
.pager i { width: 6px; height: 6px; border-radius: 50%; background: rgba(120, 150, 200, 0.3); transition: all 0.2s; }
.pager i.on { width: 16px; border-radius: 3px; background: var(--ib-acc); }
.ib-sheet .row2 { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
.ib-sheet .row2 img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
.ib-sheet input[type="color"] { width: 44px; height: 32px; border: 1px solid var(--ib-line); border-radius: 8px; background: none; padding: 2px; }
.ib-sheet .wrow input[type="checkbox"] { flex: none; }
.pick-list { margin-top: 8px; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.pick-list input[type="search"] { margin-bottom: 4px; }
.pick-item { text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--ib-line, rgba(120,150,200,.3)); background: rgba(255, 255, 255, 0.7); color: inherit; font-size: 13.5px; word-break: break-all; }
.pick-item.added { color: var(--ib-tx3); }
.pick-item:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar"><button class="back-btn" onclick="location.href='/'">⬅</button><h2>AI 名片</h2>
    <button type="button" class="pack-btn" id="pack-btn">导入人设包</button><input type="file" id="pack-file" accept=".json,application/json" hidden></div>
  <div class="deck" id="deck"></div>
  <div class="pager" id="pager"></div>
</div>
<script>
(function () {
  'use strict';
  var data = { user: { name: '你' }, actors: [] };
  var deck = document.getElementById('deck');
  var pager = document.getElementById('pager');
  var CHAT = { aion: '/chat', connor: '/chatroom' };

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function daysSince(date) {
    if (!date) return null;
    var d = new Date(date + 'T00:00:00'); if (isNaN(d)) return null;
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.max(0, Math.round((t - d) / 86400000));
  }
  function nextAnniv(date) {
    if (!date) return null;
    var d = new Date(date + 'T00:00:00'); if (isNaN(d)) return null;
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var n = new Date(d); n.setFullYear(t.getFullYear()); if (n < t) n.setFullYear(t.getFullYear() + 1);
    return Math.round((n - t) / 86400000);
  }

  function render() {
    var keep = deck.scrollLeft;
    deck.innerHTML = '';
    data.actors.forEach(function (a) {
      var days = daysSince(a.meet_since), left = nextAnniv(a.meet_since);
      var card = document.createElement('section');
      card.className = 'card' + (a.enabled ? '' : ' off');
      card.style.setProperty('--c', a.color || '#5c86c8');
      var chat = CHAT[a.id] || '/chatroom?seat=' + encodeURIComponent(a.id);
      card.innerHTML =
        '<div class="cover"><span class="no">No. ' + a.seat + (a.builtin ? (a.id === 'aion' ? ' · 主 AI' : ' · 第二位') : '') + '</span></div>' +
        (a.avatar ? '<div class="ava"><img src="' + esc(a.avatar) + '" alt=""></div>' : '<div class="ava empty">' + esc((a.name || '?').slice(0, 1)) + '</div>') +
        '<div class="body">' +
        '<div class="name">' + esc(a.name) + '</div>' +
        '<div class="sign">' + (a.enabled ? esc(a.sign || '') : '这个位置还空着，以后有新的 TA 可以住进来') + '</div>' +
        (a.enabled ? '<div class="stats"><div class="stat"><b>' + (days === null ? '—' : days) + '</b><span>days together</span></div>' +
          '<div class="stat"><b>' + (left === null ? '—' : left) + '</b><span>to anniversary</span></div></div>' +
          '<div class="meta">' + (a.memory_hub ? 'Memory Hub · ' + esc(a.memory_hub) : '未接入 Memory Hub') + '</div>' : '') +
        '<div class="btns">' +
        (a.enabled
          ? '<button type="button" data-edit="' + a.id + '">编辑</button>' + (chat ? '<a class="primary" href="' + chat + '">去聊天</a>' : '<button type="button" class="muted" disabled>聊天即将开放</button>')
          : '<button type="button" class="primary" data-enable="' + a.id + '">启用这个位置</button>') +
        '</div></div>';
      deck.appendChild(card);
    });
    pager.innerHTML = data.actors.map(function () { return '<i></i>'; }).join('');
    deck.scrollLeft = keep;
    syncPager();
  }

  function syncPager() {
    var cards = deck.children; if (!cards.length) return;
    var w = cards[0].getBoundingClientRect().width + 14;
    var i = Math.round(deck.scrollLeft / w);
    Array.prototype.forEach.call(pager.children, function (dot, j) { dot.classList.toggle('on', j === i); });
  }
  deck.addEventListener('scroll', syncPager, { passive: true });

  function save(id, patch) {
    return fetch('/api/actors/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.status); return j; }); })
      .then(function (updated) { if (updated && updated.notice) alert(updated.notice);
        data.actors = data.actors.map(function (a) { return a.id === id ? updated : a; }); render(); });
  }

  function openEdit(a) {
    var mask = document.createElement('div'); mask.className = 'ib-sheet-mask';
    var box = document.createElement('div'); box.className = 'ib-sheet';
    var nameField = a.builtin
      ? '<div class="hint">名字在' + (a.id === 'aion' ? '「世界书」' : '「聊天室设置」') + '里改，这里会自动同步。</div>'
      : '<label class="field">名字<input type="text" id="f-name" maxlength="24"></label>';
    box.innerHTML = '<h3>' + esc(a.name) + '<small>No. ' + a.seat + '</small></h3>' +
      '<div class="sec"><b>头像</b><div class="row2"><img id="f-ava" src="' + esc(a.avatar || '/public/AIIcon.png') + '" alt="">' +
      '<div class="acts" style="margin:0;flex:1"><button type="button" id="f-up">换头像</button></div></div><input type="file" id="f-file" accept="image/*" hidden></div>' +
      '<div class="sec">' + nameField +
      '<label class="field">签名<input type="text" id="f-sign" maxlength="80" placeholder="一句话介绍 TA"></label>' +
      '<label class="field">相遇的日子<input type="date" id="f-meet"></label>' +
      '<label class="field">Memory Hub 身份（source_ai）<input type="text" id="f-hub" maxlength="40" placeholder="例如 claude / lucien / jasper"></label>' +
      '<div class="wrow" style="margin-top:12px"><span>TA 自己的模型</span>' +
      '<span class="seg"><button type="button" id="f-mode-pick">选中转站</button><button type="button" id="f-mode-own">单独填</button></span></div>' +
      '<div id="f-pick">' +
      '<label class="field">中转站<select id="f-route"></select></label>' +
      '<label class="field">模型<select id="f-model"></select></label>' +
      '<div id="f-more" class="pick-list" style="display:none"><input type="search" id="f-more-q" placeholder="搜索模型，例如 opus / gemini">' +
      '<div id="f-more-list"></div></div>' +
      '<div id="f-new" style="display:none">' +
      '<label class="field">中转站名字<input type="text" id="f-new-name" maxlength="40" placeholder="例如 红豆沙"></label>' +
      '<label class="field">地址<input type="text" id="f-new-url" maxlength="300" placeholder="https://中转站地址/v1" autocomplete="off"></label>' +
      '<label class="field">Key<input type="password" id="f-new-key" maxlength="500" autocomplete="new-password"></label>' +
      '<div class="acts" style="margin-top:8px"><button type="button" id="f-new-fetch">拉取模型列表</button></div>' +
      '<input type="search" id="f-new-q" placeholder="搜索模型，例如 opus / gemini" style="display:none;margin-top:8px">' +
      '<div id="f-new-list" class="pick-list"></div>' +
      '</div>' +
      '<div class="hint" id="f-route-hint"></div>' +
      '</div>' +
      '<div id="f-own" style="display:none">' +
      '<label class="field">API 地址<input type="text" id="f-api-url" maxlength="300" placeholder="https://中转站地址/v1" autocomplete="off"></label>' +
      '<label class="field">Key<input type="password" id="f-api-key" maxlength="500" autocomplete="new-password"></label>' +
      '<label class="field">模型名<input type="text" id="f-api-model" maxlength="120" placeholder="例如 gemini-3-pro" autocomplete="off"></label>' +
      (a.api ? '<button type="button" class="link" id="f-api-clear">不用自己填的了</button>' : '') +
      '</div>' +
      '<div class="hint">' + (a.builtin
        ? '聊天室里用它' + (a.id === 'connor' ? '（Codex 仍可在聊天室设置里选）' : '') + '；交接卡和做梦也用它。'
        : '私聊、交接卡、做梦都用它。没选就不回复，不会换成别的模型。') + '</div>' +
      '<label class="field" style="margin-top:12px">后台用的线路（可不选）<select id="f-bg"><option value="">和上面一样</option></select></label>' +
      '<div class="hint">自主活动、做梦、交接卡、旅行、出门逛走这条。要和上面是<b>同一个模型</b>，只是换一家中转站（比如聊天走按次、后台走按量），这样还是 TA 自己。</div>' +
      '<div class="wrow" style="margin-top:10px"><span>名片颜色</span><input type="color" id="f-color"></div>' +
      (a.id !== 'aion' ? '<div class="wrow"><span>启用这个位置</span><input type="checkbox" id="f-on"></div>' : '') +
      (!a.builtin ? '<div class="sec" id="f-evo"><b>人格成长</b>' +
        '<div class="wrow"><span>每天 05:00 自动复盘</span><input type="checkbox" id="f-evo-on"></div>' +
        '<div class="hint">和小克、Lucien 一样：读你给 TA 的点赞 / 点踩理由和 TA 的日记，慢慢改写自己的人设。核心身份、关系锚点、边界与禁令不会被改。</div>' +
        '<div class="acts" style="margin:6px 0 0"><button type="button" id="f-evo-run">现在复盘一次</button></div>' +
        '<div class="hint" id="f-evo-latest">最近复盘：读取中…</div></div>' : '') +
      '</div><div class="acts"><button type="button" data-x="cancel">取消</button><button type="button" class="primary" data-x="save">保存</button></div>';
    mask.appendChild(box); document.body.appendChild(mask);
    mask.addEventListener('click', function (e) { if (e.target === mask) mask.remove(); });
    var $ = function (s) { return box.querySelector(s); };
    if ($('#f-name')) $('#f-name').value = a.name.indexOf('空位') === 0 ? '' : a.name;
    $('#f-sign').value = a.sign || ''; $('#f-meet').value = a.meet_since || ''; $('#f-hub').value = a.memory_hub || '';
    $('#f-color').value = /^#[0-9a-f]{6}$/i.test(a.color) ? a.color : '#5c86c8';
    if ($('#f-on')) $('#f-on').checked = !!a.enabled;
    // ── 座位的人格成长：开关即时保存；可以手动复盘一次；显示最近一次结果（文字用 textContent） ──
    if ($('#f-evo')) {
      var evoBase = '/api/persona-evolution/seat/' + encodeURIComponent(a.id);
      var showLatest = function () {
        fetch(evoBase + '/runs?limit=1', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
          var run = (j.runs || [])[0];
          $('#f-evo-latest').textContent = run
            ? '最近复盘：' + (run.window_label || '') + ' · ' + (run.user_message || run.summary || run.status || '')
            : '最近复盘：暂无记录';
        }).catch(function () { $('#f-evo-latest').textContent = '最近复盘：读取失败'; });
      };
      fetch(evoBase + '/config', { cache: 'no-store' }).then(function (r) { return r.json(); })
        .then(function (j) { $('#f-evo-on').checked = !!j.enabled; }).catch(function () {});
      $('#f-evo-on').onchange = function () {
        var box2 = this;
        fetch(evoBase + '/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: box2.checked }) })
          .then(function (r) { if (!r.ok) throw new Error(r.status); })
          .catch(function (e) { box2.checked = !box2.checked; alert('没保存上：' + e.message); });
      };
      $('#f-evo-run').onclick = function () {
        var btn = this; btn.disabled = true; $('#f-evo-latest').textContent = '复盘中，可能要一两分钟…';
        post(evoBase + '/run-test', {}).then(function (res) {
          $('#f-evo-latest').textContent = '这次复盘：' + (res.message || res.status || '完成');
        }).catch(function (e) { $('#f-evo-latest').textContent = '复盘没成功：' + e.message; })
          .then(function () { btn.disabled = false; });
      };
      showLatest();
    }
    // ── 选中转站 → 选模型；模型可以直接从中转站拉；也可以在这里新加一个中转站（Key 只存服务器） ──
    var models = [];
    function post(url, body) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.status); return j; }); });
    }
    function opt(sel, value, text) { var o = document.createElement('option'); o.value = value; o.textContent = text; sel.appendChild(o); return o; }
    function routeOf(m) { return m.route_id || '__builtin'; }
    function routes() {
      var seen = {}, list = [];
      models.forEach(function (m) {
        var id = routeOf(m);
        if (id.indexOf('seat_') === 0 && id !== 'seat_' + a.id) return;  // 别的 AI 单独填的线路不给这位选
        if (!seen[id]) { seen[id] = true; list.push({ id: id, name: m.route_id ? (m.route_name || '中转站') : '内置 / 其他' }); }
      });
      // 自己的中转站排前面，内置的放最后
      return list.filter(function (r) { return r.id !== '__builtin'; }).concat(list.filter(function (r) { return r.id === '__builtin'; }));
    }
    function fillBackground(current) {
      var sel = $('#f-bg'), groups = {};
      sel.innerHTML = ''; opt(sel, '', '和上面一样');
      var list = models.slice(), keys = models.map(function (m) { return m.key; });
      if (current && keys.indexOf(current) < 0) list.unshift({ key: current, route_name: '已失效' });
      list.forEach(function (m) {
        var g = m.route_name || '内置', grp = groups[g];
        if (!grp) { grp = groups[g] = document.createElement('optgroup'); grp.label = g; sel.appendChild(grp); }
        opt(grp, m.key, m.key);
      });
      sel.value = current || '';
    }
    function fillModels(routeId, current) {
      var sel = $('#f-model');
      sel.innerHTML = '';
      $('#f-more').style.display = 'none'; $('#f-new').style.display = routeId === '__new' ? '' : 'none';
      $('#f-model').parentNode.style.display = routeId === '__new' ? 'none' : '';
      if (routeId === '__new') { $('#f-route-hint').textContent = '填好地址和 Key，拉取模型后点一个，就会存成一个新的中转站。'; return; }
      opt(sel, '', '（未选）');
      models.filter(function (m) { return routeOf(m) === routeId; }).forEach(function (m) {
        opt(sel, m.key, m.model && m.model !== m.key ? m.key + '（' + m.model + '）' : m.key);
      });
      if (current && !models.some(function (m) { return m.key === current; })) opt(sel, current, current + '（已失效）');
      if (routeId !== '__builtin') opt(sel, '__more', '＋ 从这个中转站拉取更多模型…');
      sel.value = current || '';
      $('#f-route-hint').textContent = routeId === '__builtin' ? '' : '没看到想要的模型？选最下面的「拉取更多」。';
    }
    function fillRoutes(selectRoute, selectModel) {
      var sel = $('#f-route');
      sel.innerHTML = '';
      routes().forEach(function (r) { opt(sel, r.id, r.name); });
      opt(sel, '__new', '＋ 新加一个中转站');
      var current = models.filter(function (m) { return m.key === selectModel; })[0];
      var routeId = selectRoute || (current ? routeOf(current) : (routes()[0] || { id: '__new' }).id);
      sel.value = routeId;
      fillModels(routeId, selectModel);
    }
    function reload(selectRoute, selectModel) {
      return fetch('/api/models', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (list) {
        models = list;
        fillRoutes(selectRoute, selectModel);
        fillBackground($('#f-bg').value || a.background_model);
      });
    }
    function showPickList(box, ids, onPick) {
      box.innerHTML = '';
      ids.forEach(function (item) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pick-item' + (item.added ? ' added' : '');
        b.textContent = item.id + (item.added ? '（已添加）' : '');
        b.setAttribute('data-q', item.id.toLowerCase());
        b.onclick = function () { onPick(item.id, b); };
        box.appendChild(b);
      });
      if (!ids.length) box.textContent = '这个中转站没有返回模型';
    }
    $('#f-route').onchange = function () { fillModels(this.value, ''); };
    $('#f-model').onchange = function () {
      if (this.value !== '__more') { $('#f-more').style.display = 'none'; return; }
      var routeId = $('#f-route').value, sel = this;
      sel.value = '';
      $('#f-route-hint').textContent = '正在问中转站有哪些模型…';
      post('/api/custom-routes/' + encodeURIComponent(routeId) + '/models').then(function (res) {
        $('#f-route-hint').textContent = '点一个就选它（会顺手存进这个中转站）。';
        $('#f-more').style.display = '';
        showPickList($('#f-more-list'), res.models || [], function (id, btn) {
          btn.disabled = true;
          post('/api/custom-routes/' + encodeURIComponent(routeId) + '/add-model', { model: id })
            .then(function (r) { return reload(routeId, r.key); })
            .catch(function (e) { btn.disabled = false; alert('没加上：' + e.message); });
        });
      }).catch(function (e) { $('#f-route-hint').textContent = e.message; });
    };
    $('#f-more-q').oninput = function () {
      var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(box.querySelectorAll('#f-more-list .pick-item'), function (b) {
        b.style.display = !q || b.getAttribute('data-q').indexOf(q) >= 0 ? '' : 'none';
      });
    };
    $('#f-new-q').oninput = function () {
      var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(box.querySelectorAll('#f-new-list .pick-item'), function (b) {
        b.style.display = !q || b.getAttribute('data-q').indexOf(q) >= 0 ? '' : 'none';
      });
    };
    $('#f-new-fetch').onclick = function () {
      var url = $('#f-new-url').value.trim(), key = $('#f-new-key').value.trim(), btn = this;
      if (!url) { alert('先填中转站地址'); return; }
      btn.disabled = true; btn.textContent = '正在问中转站…';
      post('/api/custom-routes/models', { base_url: url, api_key: key }).then(function (res) {
        $('#f-new-q').style.display = '';
        showPickList($('#f-new-list'), (res.models || []).map(function (id) { return { id: id }; }), function (id, b) {
          b.disabled = true;
          post('/api/custom-routes', { name: $('#f-new-name').value.trim(), base_url: url, api_key: key, model: id })
            .then(function (r) { $('#f-new-key').value = ''; return reload(r.route_id, r.key); })
            .catch(function (e) { b.disabled = false; alert('没存上：' + e.message); });
        });
      }).catch(function (e) { alert(e.message); })
        .then(function () { btn.disabled = false; btn.textContent = '拉取模型列表'; });
    };
    reload('', a.model).catch(function () {});
    // 自己填的 API：Key 不回显，留空表示沿用已保存的
    var mode = a.api && a.api.key === a.model ? 'own' : 'pick', clearApi = false;
    function setMode(m) {
      mode = m;
      $('#f-pick').style.display = m === 'pick' ? '' : 'none'; $('#f-own').style.display = m === 'own' ? '' : 'none';
      $('#f-mode-pick').classList.toggle('on', m === 'pick'); $('#f-mode-own').classList.toggle('on', m === 'own');
    }
    $('#f-mode-pick').onclick = function () { setMode('pick'); };
    $('#f-mode-own').onclick = function () { setMode('own'); };
    if (a.api) {
      $('#f-api-url').value = a.api.base_url || ''; $('#f-api-model').value = a.api.model || '';
      $('#f-api-key').placeholder = a.api.has_key ? '已保存（不显示），留空不改' : '';
    }
    if ($('#f-api-clear')) $('#f-api-clear').onclick = function () {
      clearApi = true; $('#f-api-url').value = ''; $('#f-api-key').value = ''; $('#f-api-model').value = ''; setMode('pick');
    };
    setMode(mode);
    var avatar = a.avatar || '';
    $('#f-up').onclick = function () { $('#f-file').click(); };
    $('#f-file').onchange = function () {
      var f = this.files && this.files[0]; if (!f) return;
      var fd = new FormData(); fd.append('file', f);
      fetch('/api/actors/' + a.id + '/avatar', { method: 'POST', body: fd })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.status); return j; }); })
        .then(function (j) { avatar = j.url; $('#f-ava').src = j.url; })
        .catch(function (e) { alert('上传失败：' + e.message); });
    };
    $('[data-x="cancel"]').onclick = function () { mask.remove(); };
    $('[data-x="save"]').onclick = function () {
      var patch = { sign: $('#f-sign').value, meet_since: $('#f-meet').value, memory_hub: $('#f-hub').value, color: $('#f-color').value, avatar: avatar };
      if (mode === 'own') {
        var url = $('#f-api-url').value.trim(), model = $('#f-api-model').value.trim();
        if (!url || !model) { alert('请填 API 地址和模型名'); return; }
        patch.api = { base_url: url, api_key: $('#f-api-key').value.trim(), model: model };
      } else {
        // 正在新加中转站、还没选好模型时，不动原来的模型
        var picked = $('#f-route').value === '__new' ? a.model : $('#f-model').value;
        patch.model = picked === '__more' ? a.model : picked;
        if (clearApi) patch.api = null;
      }
      patch.background_model = $('#f-bg').value;
      if ($('#f-name')) patch.name = $('#f-name').value;
      if ($('#f-on')) patch.enabled = $('#f-on').checked;
      save(a.id, patch).then(function () { mask.remove(); }).catch(function (e) { alert('保存失败：' + e.message); });
    };
  }

  deck.addEventListener('click', function (e) {
    var ed = e.target.closest('[data-edit]');
    if (ed) { openEdit(data.actors.filter(function (a) { return a.id === ed.dataset.edit; })[0]); return; }
    var en = e.target.closest('[data-enable]');
    if (en) { var a = data.actors.filter(function (x) { return x.id === en.dataset.enable; })[0]; openEdit(Object.assign({}, a, { enabled: true })); }
  });

  var packFile = document.getElementById('pack-file');
  document.getElementById('pack-btn').onclick = function () { packFile.click(); };
  packFile.onchange = function () {
    var f = this.files && this.files[0]; this.value = '';
    if (!f) return;
    f.text().then(function (text) {
      var pack = JSON.parse(text);
      var who = Object.keys(pack.actors || {}).map(function (id) { var a = data.actors.filter(function (x) { return x.id === id; })[0]; return a ? a.name : id; });
      if (!confirm('导入人设包会替换这些人设：' + who.join('、') + (pack.about_user ? '，以及「关于你」' : '') + '。\n原来的版本会自动备份。继续吗？')) return;
      return fetch('/api/actors/persona-pack', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: text })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.status); return j; }); })
        .then(function (j) { alert('已导入：' + who.join('、') + '\n备份文件：' + j.backup); });
    }).catch(function (e) { alert('导入失败：' + (e && e.message ? e.message : '文件不是有效的人设包')); });
  };

  fetch('/api/actors', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (d) { data = d; render(); })
    .catch(function () { deck.innerHTML = '<p style="margin:auto;color:#7d92b5">读取失败，请刷新</p>'; });
})();
</script>
</body>
</html>
