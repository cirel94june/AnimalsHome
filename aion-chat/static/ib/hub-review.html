<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe9f6">
<title>家里的记忆 · 待确认</title>
<link rel="stylesheet" href="/static/ib/desk.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body { font-family: var(--ib-sys, system-ui, sans-serif); color: var(--ib-tx, #0a1e42); -webkit-tap-highlight-color: transparent; }
.page { min-height: 100dvh; display: flex; flex-direction: column; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.top-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 6px; }
.top-bar h2 { font-family: var(--ib-serif); font-weight: 400; font-size: 20px; flex: 1; min-width: 0; }
.back-btn { border: none; background: rgba(255,255,255,.55); border-radius: 50%; width: 34px; height: 34px; font-size: 15px; color: var(--ib-acc); }
.intro { padding: 0 18px 8px; font-size: 13px; color: var(--ib-tx2, #4a5d80); line-height: 1.6; }
.tabs { display: flex; gap: 8px; padding: 6px 16px 10px; }
.tab { flex: 1; border: 1px solid rgba(255,255,255,.8); background: rgba(255,255,255,.45); border-radius: 999px; padding: 8px 0; font-size: 14px; color: var(--ib-tx); }
.tab[aria-selected="true"] { background: var(--ib-acc, #3d6fd8); color: #fff; border-color: transparent; }
.tab b { font-weight: 600; margin-left: 4px; }
.list { display: flex; flex-direction: column; gap: 12px; padding: 0 16px; }
.card { border-radius: 22px; padding: 16px 16px 14px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.85);
  box-shadow: 0 10px 30px rgba(70,100,150,.12); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); }
.meta { font-size: 12px; color: var(--ib-tx3, #7b8aa6); display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 8px; }
.content { font-size: 16px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.quote { margin-top: 10px; padding: 8px 12px; border-left: 3px solid var(--ib-acc, #3d6fd8); background: rgba(255,255,255,.5); border-radius: 8px;
  font-size: 13.5px; line-height: 1.6; color: var(--ib-tx2, #4a5d80); white-space: pre-wrap; word-break: break-word; }
.why { margin-top: 8px; font-size: 12.5px; color: var(--ib-tx3, #7b8aa6); line-height: 1.5; }
.olds { margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(120,150,200,.35); }
.olds h4 { font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--ib-tx2, #4a5d80); }
.old { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; line-height: 1.55; padding: 6px 0; }
.old input { margin-top: 4px; flex: none; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btns button { flex: 1 1 auto; min-width: 30%; padding: 10px 6px; border-radius: 14px; border: 1px solid rgba(255,255,255,.85);
  background: rgba(255,255,255,.7); font-size: 14px; color: var(--ib-tx); }
.btns .yes { background: var(--ib-acc, #3d6fd8); color: #fff; border: none; }
.btns .no { color: #b4485a; }
.btns button:disabled { opacity: .5; }
.edit { width: 100%; margin-top: 10px; min-height: 84px; border-radius: 12px; border: 1px solid rgba(120,150,200,.4); padding: 10px;
  font: inherit; font-size: 15px; background: rgba(255,255,255,.85); color: var(--ib-tx); }
.empty { text-align: center; padding: 48px 20px; color: var(--ib-tx3, #7b8aa6); font-size: 14px; line-height: 1.7; }
.toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 88%;
  background: rgba(20,30,50,.86); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 50; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar"><button class="back-btn" onclick="history.length > 1 ? history.back() : (location.href='/')">⬅</button><h2>家里的记忆 · 待确认</h2></div>
  <p class="intro">「要你点头」的，你点了才会记下。「看一眼」的已经按你的原话记下了，没问题就点一下，不看也不影响。收起都不是删除，可以找回。</p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-status="pending" aria-selected="true">要你点头<b id="n-pending"></b></button>
    <button class="tab" role="tab" data-status="review_after" aria-selected="false">看一眼<b id="n-review"></b></button>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
(function () {
  var status = 'pending';
  var list = document.getElementById('list');
  var ROOMS = { living_room: '客厅', bedroom: '卧室', study: '书房', kitchen: '厨房', dreams: '梦' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(text) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = text; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
  function when(iso) { var d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function api(method, url, body) {
    return fetch(url, { method: method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.__status = r.status; return j; }); });
  }

  function loadSummary() {
    api('GET', '/api/hub-review/summary').then(function (j) {
      if (j.__status !== 200) return;
      document.getElementById('n-pending').textContent = j.waiting ? j.waiting : '';
      document.getElementById('n-review').textContent = j.review_after ? j.review_after : '';
    });
  }

  function load() {
    list.innerHTML = '<div class="empty">读取中…</div>';
    api('GET', '/api/hub-review/list?status=' + status).then(function (j) {
      if (j.__status !== 200) { list.innerHTML = '<div class="empty">' + esc(j.detail || '读不到') + '</div>'; return; }
      if (!j.items.length) { list.innerHTML = '<div class="empty">' + (status === 'pending' ? '没有要你点头的记忆了 ✨' : '没有要看的了 ✨') + '</div>'; return; }
      list.innerHTML = '';
      j.items.forEach(function (item) { list.appendChild(card(item)); });
    });
  }

  function card(item) {
    var el = document.createElement('div'); el.className = 'card';
    var room = ROOMS[item.proposed_room] || item.proposed_room || '';
    var who = item.who || item.proposer_ai_id || item.owner_ai || '';
    var olds = (item.conflict_targets || []).map(function (t, i) {
      return '<label class="old"><input type="checkbox" data-i="' + i + '"><span>' + esc(t.content) + '</span></label>';
    }).join('');
    var pending = status === 'pending';
    el.innerHTML =
      '<div class="meta">' + (room ? '<span>' + esc(room) + '</span>' : '') + (who ? '<span>' + esc(who) + ' 记的</span>' : '') +
      (item.created_at ? '<span>' + esc(when(item.created_at)) + '</span>' : '') + '</div>' +
      '<div class="content">' + esc(item.content) + '</div>' +
      (item.verified_quote ? '<div class="quote">你说的：' + esc(item.verified_quote) + '</div>' :
        item.evidence_excerpt ? '<div class="quote">来自：' + esc(item.evidence_excerpt) + '</div>' : '') +
      (item.triage_reason ? '<div class="why">为什么要你看：' + esc(item.triage_reason) + '</div>' : '') +
      (olds ? '<div class="olds"><h4>和这些旧的对不上，勾上的会收起：</h4>' + olds + '</div>' : '') +
      '<div class="btns">' + (pending
        ? '<button class="yes" data-a="approve">要</button><button data-a="edit">改一下再要</button><button class="no" data-a="reject">不要</button>'
        : '<button class="yes" data-a="seen">没问题</button><button data-a="edit">改一下</button><button class="no" data-a="retire">不对</button>') +
      '</div>';
    el.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-a]'); if (!btn) return;
      var action = btn.dataset.a;
      if (action === 'edit') { openEdit(el, item); return; }
      var body = { action: pending ? (action === 'reject' ? 'reject' : 'approve') : 'seen' };
      if (action === 'retire') {
        if (!confirm('这条记忆收起来？以后还能找回。')) return;
        body.retire = true;
      }
      send(el, item, body);
    });
    return el;
  }

  function retireIds(el, item) {
    return Array.prototype.filter.call(el.querySelectorAll('.old input'), function (box) { return box.checked; })
      .map(function (box) { var t = item.conflict_targets[+box.dataset.i]; return { id: t.id, updated_at: t.updated_at }; });
  }

  function openEdit(el, item) {
    if (el.querySelector('.edit')) return;
    var area = document.createElement('textarea'); area.className = 'edit'; area.value = item.content || '';
    var row = document.createElement('div'); row.className = 'btns';
    row.innerHTML = '<button class="yes" data-save>就这样记</button><button data-cancel>算了</button>';
    el.querySelector('.btns').before(area, row);
    row.querySelector('[data-cancel]').onclick = function () { area.remove(); row.remove(); };
    row.querySelector('[data-save]').onclick = function () {
      var text = area.value.trim(); if (!text) { toast('写点什么再保存'); return; }
      send(el, item, { action: status === 'pending' ? 'approve' : 'seen', content: text });
    };
  }

  function send(el, item, body) {
    var picked = retireIds(el, item);
    if (picked.length && !body.retire) body.retire_ids = picked;
    Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) { b.disabled = true; });
    api('POST', '/api/hub-review/' + encodeURIComponent(item.id), body).then(function (j) {
      if (j.__status === 200 && j.ok) {
        el.remove(); toast(j.already ? '已经处理过了' : '好了'); loadSummary();
        if (!list.children.length) load();
        return;
      }
      Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) { b.disabled = false; });
      toast(j.detail || '没保存，再试一次');
      if (j.__status === 409 || j.__status === 404) setTimeout(load, 1200);  // 刚被改过：刷新，不当成已保存
    }).catch(function () {
      Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) { b.disabled = false; });
      toast('网络不太好，这次没保存');
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.onclick = function () {
      status = tab.dataset.status;
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.setAttribute('aria-selected', t === tab ? 'true' : 'false'); });
      load();
    };
  });
  loadSummary(); load();
})();
</script>
</body>
</html>
