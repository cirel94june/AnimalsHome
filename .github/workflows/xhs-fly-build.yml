name: Validate isolated XHS browser image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xhs-browser-image-check
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned browser dependencies
        run: docker build -f deploy/fly-xhs/Dockerfile -t xhs-check .
      - name: Check gateway without any real account
        shell: bash
        run: |
          set -euo pipefail
          GATEWAY_TOKEN=$(openssl rand -hex 32)
          trap 'docker rm -f xhs-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name xhs-check --memory=1536m --cpus=1 -p 127.0.0.1:18080:8080 -e XHS_GATEWAY_TOKEN="$GATEWAY_TOKEN" xhs-check
          for try in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/candidate)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GATEWAY_TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18080/status)" = 200
          docker exec xhs-check google-chrome --version
          docker exec xhs-check python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('browser_driver_started'); p.stop()"
          docker exec xhs-check node --version
          docker image inspect xhs-check --format 'image_bytes={{.Size}}'
