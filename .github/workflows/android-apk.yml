# 安卓 App 自动打包：AionApp 有改动时自动跑单测并打包，安装包在本次运行页面底部「Artifacts」下载。
# 也可以在 Actions 页面手动点「Run workflow」。
name: Android APK

on:
  push:
    branches: [claude/frontend-memory-integration-ke0lpe, main]
    paths: [AionApp/**, .github/workflows/android-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AionApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少签名密钥（仓库 Settings → Secrets 里的 ANDROID_KEYSTORE_B64）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/AionsHome-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AionsHome-apk
          path: ${{ runner.temp }}/out/*.apk
          retention-days: 30
