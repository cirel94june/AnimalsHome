# APP NAME is chosen at deployment; only the new animalshome-xhs-* app is allowed.
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "deploy/fly-xhs/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = false
  auto_stop_machines = "stop"
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 2

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"

[[mounts]]
  source = "xhs_profile"
  destination = "/data"

[[restart]]
  policy = "no"
